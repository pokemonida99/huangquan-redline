<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="紅線護軍師">
<meta name="theme-color" content="#0e0a0f">
<title>紅線護軍師</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <!-- 遊戲中 -->
  <div id="hud" class="hide">
    <div class="h1">
      <button class="ib" id="bMenu" aria-label="選關"><svg viewBox="0 0 40 40"><path d="M25 8 L12 20 L25 32"/></svg></button>
      <button class="ib" id="bRetry" aria-label="重來"><svg viewBox="0 0 40 40"><path d="M30 20 A10 10 0 1 1 26 12"/><path d="M27 5 L27 13 L19 13"/></svg></button>
      <div class="lv"><b id="lvNum">第 1 關</b><span id="lvName"></span></div>
      <button class="ib" id="bMute" aria-label="聲音"><svg viewBox="0 0 40 40"><path d="M8 16 H14 L22 9 V31 L14 24 H8 Z"/><path class="wave" d="M27 14 Q31 20 27 26"/><path class="x" d="M27 15 L35 25 M35 15 L27 25"/></svg></button>
    </div>
    <div class="h2">
      <div class="inkwrap">
        <svg class="spool" viewBox="0 0 40 40"><rect x="9" y="6" width="22" height="5"/><rect x="9" y="29" width="22" height="5"/><path d="M12 13 H28 M12 17 H28 M12 21 H28 M12 25 H28"/></svg>
        <i><em id="inkBar"></em></i>
        <div id="inkSeals"><b>緣</b><b>緣</b><b>緣</b></div>
      </div>
      <div id="timer">10</div>
    </div>
    <button id="bHint" class="hint"><img src="art/yuelao-smile.webp" alt="">月老指點</button>
  </div>
  <div id="tip" class="hide"><p id="tipText"></p></div>

  <!-- 結算 -->
  <div id="result" class="hide">
    <h2 id="rTitle">護駕成功</h2>
    <div class="seals" id="rSeals"></div>
    <p id="rLine"></p>
    <div class="row">
      <button class="btn ghost" id="rRetry">重來</button>
      <button class="btn" id="rNext">下一關</button>
    </div>
  </div>

  <!-- 標題 -->
  <div id="title" class="screen">
    <div class="stamp">黃泉<br>燒肉店</div>
    <h1>紅線<br>護軍師</h1>
    <p class="sub">月老出手，一條紅線擋住滿天蝙蝠</p>
    <img class="t-yuelao" src="art/yuelao-smile.webp" alt="">
    <img class="t-rat" src="art/head-scared.webp" alt="">
    <svg class="t-thread" viewBox="0 0 720 1280" preserveAspectRatio="none"><path d="M505 795 C 440 900, 380 760, 320 870 S 290 950, 268 935"/></svg>
    <div class="t-btns">
      <button class="btn big" id="bStart">開始牽線</button>
      <button class="btn ghost" id="bSelect">選關</button>
    </div>
  </div>

  <!-- 選關 -->
  <div id="select" class="screen hide">
    <div class="sel-head"><button class="tag" id="bBack">返回</button><h2>選關</h2><span id="selTotal"></span></div>
    <div id="grid"></div>
    <p class="sel-foot">畫一條紅線護住鼠軍師，撐過倒數就過關。紅線用得越少，蓋的「緣」印越多。</p>
  </div>
</div>
<script src="vendor/matter.min.js"></script>
<script src="js/sim.js?v=2"></script>
<script src="js/levels.js?v=2"></script>
<script src="js/audio.js?v=2"></script>
<script src="js/game.js?v=2"></script>
</body>
</html>
